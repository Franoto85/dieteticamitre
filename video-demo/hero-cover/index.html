<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Hero cover — Dietética Mitre (demo conceptual, loop 8s)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px;
        overflow: hidden; background: #fffbf0;
      }
      #root {
        position: relative; width: 100%; height: 100%; overflow: hidden;
        background:
          radial-gradient(900px 480px at 50% 0%, #fff3b0 0%, rgba(255,243,176,0) 58%),
          radial-gradient(1000px 600px at 50% 42%, #eef6e2 0%, rgba(238,246,226,0) 60%),
          linear-gradient(180deg, #fffdf4 0%, #fffbf0 55%, #f3ead0 100%);
      }
      .clip { position: absolute; inset: 0; display: block; }
      #camera { position: absolute; inset: -60px; }
      .table {
        position: absolute; left: 0; right: 0; bottom: 0; height: 300px;
        background: linear-gradient(180deg, #efe4c8 0%, #e2d3a8 100%);
        border-top: 6px solid #d9c98f;
      }
      .bowl { position: absolute; }
      #jar, #herbs-left, #herbs-right, .seed { position: absolute; }
      #bowl-nuts { left: 150px; bottom: 170px; }
      #bowl-oats { right: 170px; bottom: 150px; }
      #jar { right: 560px; bottom: 210px; }
      #herbs-left { left: 620px; bottom: 180px; }
      #herbs-right { right: 480px; bottom: 430px; }
      .seed { position: absolute; border-radius: 50%; }
      #light {
        position: absolute; top: -200px; bottom: -200px; left: 0; width: 560px;
        background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,250,220,.55) 50%, rgba(255,255,255,0) 100%);
        opacity: 0;
      }
      .leaf-float { position: absolute; opacity: .8; }
      #leaf-a { left: 820px; top: 620px; }
      #leaf-b { left: 1050px; top: 700px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <section id="cover" class="clip" data-start="0" data-duration="8" data-track-index="0">
        <div id="camera" data-layout-allow-overflow aria-hidden="true">
          <div class="table"></div>
          <svg id="bowl-nuts" class="bowl" viewBox="0 0 420 260" width="420" height="260">
            <ellipse cx="210" cy="96" rx="150" ry="52" fill="#b97c2a" />
            <ellipse cx="210" cy="86" rx="122" ry="38" fill="#e8c07a" />
            <circle cx="160" cy="80" r="14" fill="#8a5a1d" />
            <circle cx="200" cy="72" r="14" fill="#8a5a1d" />
            <circle cx="240" cy="82" r="14" fill="#8a5a1d" />
            <circle cx="275" cy="72" r="12" fill="#8a5a1d" />
            <circle cx="185" cy="92" r="12" fill="#a06a24" />
            <circle cx="225" cy="94" r="12" fill="#a06a24" />
            <path d="M60 108 h300 c0 78 -67 138 -150 138 S60 186 60 108 Z" fill="#fffdf4" stroke="#7a4d14" stroke-width="10" />
          </svg>
          <svg id="bowl-oats" class="bowl" viewBox="0 0 400 250" width="400" height="250">
            <ellipse cx="200" cy="92" rx="140" ry="48" fill="#d9c98f" />
            <ellipse cx="200" cy="84" rx="114" ry="34" fill="#f3ead0" />
            <circle cx="150" cy="80" r="10" fill="#c9a86a" />
            <circle cx="185" cy="72" r="10" fill="#c9a86a" />
            <circle cx="220" cy="80" r="10" fill="#b98d4e" />
            <circle cx="255" cy="72" r="9" fill="#c9a86a" />
            <circle cx="205" cy="90" r="9" fill="#b98d4e" />
            <path d="M58 104 h284 c0 74 -63 130 -142 130 S58 178 58 104 Z" fill="#fffdf4" stroke="#7a4d14" stroke-width="10" />
          </svg>
          <svg id="jar" viewBox="0 0 220 340" width="220" height="340">
            <rect x="70" y="10" width="80" height="34" rx="10" fill="#1e3d14" />
            <rect x="52" y="44" width="116" height="270" rx="34" fill="#d99a3d" />
            <rect x="52" y="44" width="116" height="270" rx="34" fill="#fff3b0" opacity=".28" />
            <rect x="52" y="120" width="116" height="70" fill="#fffdf4" opacity=".55" />
            <ellipse cx="110" cy="300" rx="46" ry="12" fill="#8a5a1d" opacity=".45" />
          </svg>
          <svg id="herbs-left" viewBox="0 0 200 160" width="200" height="160">
            <path d="M100 150 C100 100 100 60 100 20" stroke="#2b6b18" stroke-width="8" stroke-linecap="round" fill="none" />
            <path d="M100 118 C70 114 52 98 46 76 C72 76 92 92 100 118 Z" fill="#3a7d1e" />
            <path d="M100 100 C130 96 148 80 154 58 C128 58 108 74 100 100 Z" fill="#3a7d1e" />
            <path d="M100 76 C84 72 74 60 72 46 C86 46 96 58 100 76 Z" fill="#4c9a2e" />
          </svg>
          <svg id="herbs-right" viewBox="0 0 160 130" width="160" height="130">
            <path d="M80 122 C80 84 80 52 80 18" stroke="#2b6b18" stroke-width="7" stroke-linecap="round" fill="none" />
            <path d="M80 96 C56 92 42 78 37 60 C59 60 74 74 80 96 Z" fill="#3a7d1e" />
            <path d="M80 80 C104 76 118 62 123 44 C101 44 86 58 80 80 Z" fill="#4c9a2e" />
          </svg>
          <span class="seed" style="left:520px;bottom:150px;width:22px;height:22px;background:#b97c2a;"></span>
          <span class="seed" style="left:1330px;bottom:130px;width:18px;height:18px;background:#8a5a1d;"></span>
          <span class="seed" style="left:760px;bottom:120px;width:16px;height:16px;background:#d9a441;"></span>
          <span class="seed" style="left:1150px;bottom:170px;width:20px;height:20px;background:#c9a86a;"></span>
          <div id="light"></div>
          <svg id="leaf-a" class="leaf-float" viewBox="0 0 80 44" width="80" height="44">
            <path d="M4 22 C24 4 52 4 76 22 C52 40 24 40 4 22 Z" fill="#3a7d1e" opacity=".55" />
          </svg>
          <svg id="leaf-b" class="leaf-float" viewBox="0 0 64 36" width="64" height="36">
            <path d="M3 18 C19 3 42 3 61 18 C42 33 19 33 3 18 Z" fill="#4c9a2e" opacity=".5" />
          </svg>
        </div>
      </section>
    </div>
    <script>
      var tl = gsap.timeline({ paused: true });
      tl.fromTo("#camera", { x: 0, scale: 1 }, { x: -52, scale: 1.05, duration: 4, ease: "sine.inOut" }, 0);
      tl.to("#camera", { x: 0, scale: 1, duration: 4, ease: "sine.inOut" }, 4);
      tl.fromTo("#light", { x: -500, opacity: 0 }, { x: 500, opacity: 0.6, duration: 2, ease: "sine.inOut" }, 3);
      tl.to("#light", { x: 1500, opacity: 0, duration: 3, ease: "sine.inOut" }, 5);
      tl.fromTo("#leaf-a", { y: 0, rotation: 0 }, { y: -26, rotation: 9, duration: 4, ease: "sine.inOut" }, 0);
      tl.to("#leaf-a", { y: 0, rotation: 0, duration: 4, ease: "sine.inOut" }, 4);
      tl.fromTo("#leaf-b", { y: 0, rotation: 0 }, { y: -20, rotation: -8, duration: 4, ease: "sine.inOut" }, 0.6);
      tl.to("#leaf-b", { y: 0, rotation: 0, duration: 4, ease: "sine.inOut" }, 4.6);
      tl.fromTo("#jar", { y: 0 }, { y: -12, duration: 4, ease: "sine.inOut" }, 0.4);
      tl.to("#jar", { y: 0, duration: 4, ease: "sine.inOut" }, 4.4);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
